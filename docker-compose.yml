services:
  raid-helper-attendance:
    build: .
    container_name: raid-helper-attendance-bot
    restart: unless-stopped
    environment:
      DB_PATH: /app/data/bot.sqlite
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      RAIDHELPER_API_KEY: ${RAIDHELPER_API_KEY}
      RAIDHELPER_SERVER_ID: ${RAIDHELPER_SERVER_ID}
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-20}
      PERIOD_MODE: ${PERIOD_MODE:-week}
      PERIOD_ROLLING_DAYS: ${PERIOD_ROLLING_DAYS:-30}
      ELIGIBILITY_MIN_DAYS: ${ELIGIBILITY_MIN_DAYS:-14}
      TOP_FLOP_SIZE: ${TOP_FLOP_SIZE:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Named volume by default; set RAID_HELPER_ATTENDANCE_DATA_PATH to a host
      # folder (owned by 1000:1000) to bind-mount it instead, e.g. on Unraid.
      - ${RAID_HELPER_ATTENDANCE_DATA_PATH:-raid-helper-data}:/app/data
    # Set BOT_REPLICAS=0 to keep the stack deployed without connecting to
    # Discord: never run two instances on the same token.
    deploy:
      replicas: ${BOT_REPLICAS:-1}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/DerpDerpFailer/Raid-Helper-Attendance@main/icon/raid-helper-attendance-bot-256.png
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  raid-helper-data:
